<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#bc3045">
  <title>Nyomógombos szorzótábla</title>
  <style>
    :root { color-scheme: light; --red:#bd3047; --darkred:#92273b; --cream:#fffdf3; --ink:#171717; --blue:#056eb8; }
    *,*::before,*::after {box-sizing:border-box}
    html {font-family: system-ui,-apple-system,"Segoe UI",Arial,sans-serif; scroll-behavior: auto;}
    body { margin:0; padding:0; background:#f7f5f1; color:#37292d; -webkit-tap-highlight-color:transparent; }
    .app {max-width:1260px;margin:0 auto; padding:16px 12px 28px;}
    h1 {font-size:clamp(22px,4.8vw,30px);line-height:1.15;text-align:center;margin:5px 0 7px;font-weight:800}
    .help {font-size:clamp(12px,2.5vw,14px);color:#66595c; text-align:center; margin:0 auto 18px;max-width:700px;line-height:1.45;}
    .modes {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 auto 12px;max-width:860px;}
    .mode { border:1px solid #d5bec4;background:#fff;color:#66323d;border-radius:9px;font-weight:750;font-size:clamp(12px,2.8vw,15px);min-height:42px;padding:5px 3px;cursor:pointer;box-shadow:0 2px 0 #e1d9d7;}
    .mode:focus-visible,.tile:focus-visible,.sound:focus-visible {outline:3px solid #0873c6;outline-offset:2px;}
    .mode[aria-pressed=true] {color:white;background:var(--darkred);border-color:#7d1c32;box-shadow:inset 0 2px 2px #651b29;}
    .mode.all {grid-column:span 2;}
    .tools {display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;margin:3px 0 14px;}
    .sound {font-size:13px;color:#534044;display:inline-flex;align-items:center;gap:7px;cursor:pointer;}
    .sound input {width:18px;height:18px;accent-color:var(--darkred);margin:0;}
    h2 {margin:0 0 16px;text-align:center;color:var(--darkred);font-size:clamp(19px,3.7vw,24px);}
    .board {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1120px;margin:0 auto;}
    /* A gomb teljes felülete billentyű: nincsenek szövegdobozok. */
    .tile { border:0;background:none;position:relative;display:block;padding:0;cursor:pointer;
            width:100%;height:190px;user-select:none;-webkit-user-select:none;touch-action:pan-y;min-width:0; }
    .tile::before {content:"";position:absolute;inset:7px 2px 1px 7px; border-radius:10px;
       background:linear-gradient(145deg,#992e42,#651629);box-shadow:1px 2px 3px #67222b38;}
    .cap {position:absolute;inset:1px 7px 8px 1px;border-radius:10px;
       background:linear-gradient(138deg,#e66775 0%,#be354e 52%,#a72440 100%);
       box-shadow:inset 2px 2px 1px #f58c91, inset -2px -2px 2px #6f1b2c;
       display:block;transition:transform 65ms ease,background 65ms ease;}
    .face {position:absolute;inset:10px;border-radius:4px;overflow:hidden;
       background:linear-gradient(145deg,#fffef5 0%,#f9f5e9 60%,#e9e2d1 100%);
       box-shadow:inset 1px 1px 1px #ffffff, inset -1px -1px 1px #c6baaa;
       display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 3px 20px;
       color:var(--ink);}
    .answer {visibility:hidden;line-height:1;font-weight:850;color:var(--blue);font-size:clamp(45px,8vw,65px);margin-top:7px;}
    .equation {display:flex;align-items:center;justify-content:center;gap:2px;
      white-space:nowrap;color:#111;font-size:clamp(34px,7.2vw,42px);line-height:1.1;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.5px;}
    .multiply {font-weight:800;position:relative;top:-.04em;}
    .tile.pressed::before {background:#791c32;}
    .tile.pressed .cap {transform:translate(3px,5px);background:linear-gradient(140deg,#a22d43,#881f38);box-shadow:inset 2px 2px 3px #681528,inset -1px -1px 1px #dd7886;}
    .tile.pressed .face {background:linear-gradient(135deg,#e3decf 0%,#f5f2e6 100%);box-shadow:inset 2px 2px 3px #b0a292,inset -1px -1px 1px #fffefb;}
    .tile.pressed .answer {visibility:visible;}
    .board.full {gap:9px;}
    @media (min-width:600px) {
      .app {padding:18px 20px 35px}
      .modes {grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;}
      .board {grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;}
      .tile {height:180px;}
      .answer {font-size:clamp(42px,5.5vw,60px)}
      .equation {font-size:clamp(25px,3.6vw,34px)}
      .board.full {grid-template-columns:repeat(5,minmax(0,1fr));}
    }
    @media (min-width:1110px) {
      .board.full {grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;}
      .board.full .tile {height:156px;}
      .board.full .equation {font-size:29px;}
      .board.full .answer {font-size:49px;}
      .board.full .face {inset:9px;padding:9px 2px 15px;}
    }
    @media (max-width:359px) {
      .board {gap:8px;} .tile {height:164px;}
      .face {inset:8px;padding:9px 2px 16px;}
      .equation {font-size:25px;}
      .answer {font-size:46px;}
      .app {padding-left:8px;padding-right:8px;}
    }
    @media (prefers-reduced-motion:reduce){.cap{transition:none}}
  </style>
</head>
<body>
  <main class="app">
    <h1>Nyomógombos szorzótábla</h1>
    <p class="help">A művelet mindig látható. A megoldás csak a gomb nyomva tartásakor jelenik meg.</p>
    <nav class="modes" id="modes" aria-label="Szorzótábla kiválasztása"></nav>
    <div class="tools"><label class="sound"><input type="checkbox" id="sound"> Kattanó hang</label></div>
    <h2 id="heading">5-ös szorzótábla</h2>
    <section class="board" id="board" aria-labelledby="heading"></section>
  </main>
<script>
(function(){
  'use strict';
  var board=document.getElementById('board');
  var modes=document.getElementById('modes');
  var heading=document.getElementById('heading');
  var sound=document.getElementById('sound');
  var currentMode=5;
  var audioContext=null;
  var labels=['','1-es szorzótábla','2-es szorzótábla','3-as szorzótábla',
  '4-es szorzótábla','5-ös szorzótábla','6-os szorzótábla',
  '7-es szorzótábla','8-as szorzótábla','9-es szorzótábla','10-es szorzótábla'];

  function clickSound(){
    if(!sound.checked)return;
    try{
      var AudioCtx=window.AudioContext||window.webkitAudioContext;
      if(!AudioCtx)return;
      if(!audioContext)audioContext=new AudioCtx();
      if(audioContext.state==='suspended')audioContext.resume();
      var oscillator=audioContext.createOscillator();
      var gain=audioContext.createGain();
      var t=audioContext.currentTime;
      oscillator.type='triangle';
      oscillator.frequency.setValueAtTime(660,t);
      oscillator.frequency.exponentialRampToValueAtTime(190,t+.038);
      gain.gain.setValueAtTime(.12,t);
      gain.gain.exponentialRampToValueAtTime(.001,t+.042);
      oscillator.connect(gain);gain.connect(audioContext.destination);
      oscillator.start(t); oscillator.stop(t+.045);
    } catch(ignore){}
  }
  function releaseAll(){
    var pressed=board.querySelectorAll('.tile.pressed');
    for(var i=0;i<pressed.length;i++)pressed[i].classList.remove('pressed');
  }
  function makeTile(first,second){
    var tile=document.createElement('button');
    tile.type='button';tile.className='tile';
    tile.setAttribute('aria-label',first+' szor '+second+'. Tartsd nyomva a megoldásért.');
    tile.dataset.first=String(first);tile.dataset.second=String(second);
    var cap=document.createElement('span');cap.className='cap';
    var face=document.createElement('span');face.className='face';
    var answer=document.createElement('span');answer.className='answer';
    answer.textContent=String(first*second);answer.setAttribute('aria-hidden','true');
    var eq=document.createElement('span');eq.className='equation';eq.setAttribute('aria-hidden','true');
    var a=document.createElement('span');a.textContent=String(first);
    var dot=document.createElement('span');dot.className='multiply';dot.textContent='·';
    var b=document.createElement('span');b.textContent=String(second);
    eq.appendChild(a);eq.appendChild(dot);eq.appendChild(b);
    face.appendChild(answer);face.appendChild(eq);cap.appendChild(face);tile.appendChild(cap);

    tile.addEventListener('pointerdown',function(e){
      if(e.pointerType==='mouse'&&e.button!==0)return;
      tile.classList.add('pressed');clickSound();
      try{tile.setPointerCapture(e.pointerId)}catch(ignore){}
    });
    tile.addEventListener('pointerup',function(){tile.classList.remove('pressed')});
    tile.addEventListener('pointercancel',function(){tile.classList.remove('pressed')});
    tile.addEventListener('lostpointercapture',function(){tile.classList.remove('pressed')});
    tile.addEventListener('keydown',function(e){
      if(e.code==='Space'||e.code==='Enter'){
        e.preventDefault();
        if(!tile.classList.contains('pressed')){tile.classList.add('pressed');clickSound()}
      }
    });
    tile.addEventListener('keyup',function(e){
      if(e.code==='Space'||e.code==='Enter'){
        e.preventDefault();tile.classList.remove('pressed');
      }
    });
    tile.addEventListener('contextmenu',function(e){e.preventDefault()});
    return tile;
  }
  function switchMode(mode){
    currentMode=mode;
    heading.textContent=mode===0?'Teljes szorzótábla (1–10)':labels[mode];
    board.classList.toggle('full',mode===0);
    var buttons=modes.querySelectorAll('.mode');
    for(var i=0;i<buttons.length;i++){
      var active=Number(buttons[i].dataset.mode)===mode;
      buttons[i].setAttribute('aria-pressed',active?'true':'false');
    }
    var fragment=document.createDocumentFragment();
    if(mode===0){
      for(var first=1;first<=10;first++)for(var second=1;second<=10;second++)
        fragment.appendChild(makeTile(first,second));
    } else {
      for(var second=1;second<=10;second++)fragment.appendChild(makeTile(mode,second));
    }
    board.replaceChildren(fragment);
    window.scrollTo(0,0);
  }
  for(var n=1;n<=10;n++){
    var modeButton=document.createElement('button');
    modeButton.type='button';modeButton.className='mode';modeButton.dataset.mode=String(n);
    // Helyes magyar alakok: 3-as, 5-ös, 6-os, 8-as.
    modeButton.textContent={1:'1-es',2:'2-es',3:'3-as',4:'4-es',5:'5-ös',6:'6-os',7:'7-es',8:'8-as',9:'9-es',10:'10-es'}[n];
    modeButton.addEventListener('click',function(){switchMode(Number(this.dataset.mode))});
    modes.appendChild(modeButton);
  }
  var full=document.createElement('button');full.type='button';
  full.className='mode all';full.textContent='Teljes tábla';full.dataset.mode='0';
  full.addEventListener('click',function(){switchMode(0)});modes.appendChild(full);
  window.addEventListener('pointerup',releaseAll);
  window.addEventListener('blur',releaseAll);
  document.addEventListener('visibilitychange',function(){if(document.hidden)releaseAll()});
  switchMode(5);
})();
</script>
</body></html>
