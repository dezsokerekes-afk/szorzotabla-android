
name: Android APK készítése

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4
      - name: Java 17 beállítása
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK beállítása
        uses: android-actions/setup-android@v3
      - name: Android 35 platform telepítése
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9 beállítása
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Telepíthető APK elkészítése
        run: gradle --no-daemon :app:assembleDebug
      - name: APK mentése letölthető csomagként
        uses: actions/upload-artifact@v4
        with:
          name: Szorzotabla-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
